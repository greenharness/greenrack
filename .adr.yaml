# The decision registry for greenrack.
#
# Most decisions this repository lives under are FLEET decisions, made once
# in the `decisions`
# repository and vendored below. A record here deciding one of their slots
# would be a contradiction, not an override.
#
# `greentopo add github:fredericrous/decisions` refreshes the pack; nothing tells
# this repository when a fleet decision changes, so `greentopo add --check` asks.

packs:
  - .adr/packs/decisions.pack

# Keys of this repository's own answer questions the fleet does not ask;
# records live in docs/adr/.
dir: docs/adr
scopes: []
keys:
  packaging.optional-peer-entry:
    description: Where a component that needs an optional peer dependency is exported from
  components.link-navigation:
    description: How a link part of a component hands a click to the app's client-side router
  theming.overrides:
    description: Which token groups a ThemeProvider may replace, and how their values are validated and inherited

# Which parts of this repository have which traits (greentopo, SEMANTICS
# section 2.5), as `greentopo traits --detect` proposed and a reviewer accepted.
# Rules about a trait not named here are left out of the session hook and
# counted; `greentopo rules --all-traits` lists them. `greentopo traits --check`, run
# by this repository's gate, reports a package this stops describing.
areas:
  # cli: packages/cli/package.json — a `bin` entry
  packages/cli/**: [cli]
  # cli: crates/first-touch/Cargo.toml — the first-touch hook binary, a `[[bin]]` target
  crates/first-touch/**: [cli]
  # ui: packages/diagrams/package.json — `react` in dependencies
  packages/diagrams/**: [ui]
  # ui: packages/ui-email/package.json — `react` in dependencies
  packages/ui-email/**: [ui]
  # ui: packages/ui/package.json — `react` in dependencies
  packages/ui/**: [ui]
  # ui: examples/native/package.json — the Expo app that bundles the native barrel
  examples/native/**: [ui]

# The fleet stack scopes this repository is in (decisions ADR-0046):
# greentopo answers resolve/relevant at them by default.
in_scopes: [greenrack-stack]
