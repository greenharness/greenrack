# The greenrack design system as the `design` Green Harness extension (ADR-0048).
# grh manifest v2 (`[tool]`): docs/extension-manifest.md in the grh repository.
# `version` is written from the git tag by the release, beside package.json's.

[extension]
name = "design"
version = "1.0.0"
harness = ">=0.2"

[[skill]]
path = "skills/colors"

[[skill]]
path = "skills/typography"

[[skill]]
path = "skills/ui"

[[skill]]
path = "skills/greenrack-mockup"

[[agent]]
path = "agents/design-system-lookup.md"

[[mcp]]
name = "greenrack"
command = "npx"
args = ["-y", "-p", "@greenharness/greenrack-cli@^7", "-p", "@modelcontextprotocol/sdk", "greenrack", "mcp"]

# The first-touch hook (decisions:ADR-0082): greenrack installs it, grh runs
# greenrack's installer. It replaces `[[session_context]]`: the hook gives the
# index on the first touch of a consumer, wherever the session started, and
# two deliverers would print it twice. `npx` is adopted from PATH. Status is
# read as JSON, so an npx that fails (exit 1, no JSON) reads unknown, never
# absent.
[tool]
bin = "npx"

[tool.machine]
install = ["{bin}", "-y", "@greenharness/greenrack-cli@^7.7.0", "hook", "install", "--user"]
uninstall = ["{bin}", "-y", "@greenharness/greenrack-cli@^7.7.0", "hook", "uninstall", "--user"]

[tool.machine.status]
args = ["-y", "@greenharness/greenrack-cli@^7.7.0", "hook", "install", "--user", "--check", "--json"]
json = ["state"]

[[doctor]]
command = "sh -c 'r=$(git rev-parse --show-toplevel 2>/dev/null) || exit 0; cd \"$r\" || exit 0; [ -n \"$(find . -maxdepth 3 -name package.json -not -path \"*/node_modules/*\" -exec grep -l -e \"@greenharness/greenrack-\" {} + 2>/dev/null)\" ] || exit 0; exec npx -y @greenharness/greenrack-cli@^7 doctor'"
